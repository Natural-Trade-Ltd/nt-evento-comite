<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Modo presentar del constructor: la presentación principal del evento del 1 de septiembre de 2026, lámina por lámina.">
<meta name="robots" content="noindex, nofollow">
<title>Presentación · Evento 1-sep-2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Dueto Tierra en modo día: es un deck para proyectar, igual que presentacion.html. */
:root{
  --bg:#F2EDE3; --card:#FBF8F1; --line:#E0D8C8;
  --ink:#3A3129; --sub:#71655A; --faint:#9C8F80;
  --acc:#587F6B; --accInk:#F6FBF7; --acc2:#8A6F5B;
  --riesgo:#AE4E2B;
  --shadow:0 1px 2px rgba(58,49,41,.05), 0 10px 30px rgba(58,49,41,.07);
}
*{box-sizing:border-box} b,strong{font-weight:600}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.55; overflow:hidden;
}
.deck{height:100vh; overflow:hidden; position:relative}
.slide{
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center; gap:60px;
  padding:48px 64px 76px;
}
.slide.on{display:flex}
.media{flex:0 0 auto; max-width:46%}
.media img{
  display:block; max-width:100%; max-height:74vh; height:auto;
  border-radius:16px; border:1px solid var(--line); box-shadow:var(--shadow);
  background:var(--card);
}
.video{
  flex:0 0 auto; width:min(760px,52vw); aspect-ratio:16/9;
  border-radius:16px; overflow:hidden; border:1px solid var(--line);
  box-shadow:var(--shadow); background:#000;
}
.video iframe,.video video{width:100%; height:100%; border:0; display:block; background:#000}
.slide.videoSolo{justify-content:center}
.slide.videoSolo .video{width:min(1180px,86vw)}
.txt{flex:1 1 auto; max-width:620px}

/* ── Diseño por lámina (24-ago): titulo_modo (t-*) y media_tam (m-*) ──
   t-lado = clásico (default) · t-arriba = título compacto arriba, media grande
   t-oculto = solo la imagen o el video · m-lleno = de borde a borde, sin marco */
.slide.m-chico  .media{max-width:30%}  .slide.m-chico  .media img{max-height:52vh}
.slide.m-grande .media{max-width:58%}  .slide.m-grande .media img{max-height:84vh}
.slide.m-chico  .video{width:min(520px,36vw)}
.slide.m-grande .video{width:min(980px,62vw)}
.slide.t-arriba{flex-direction:column; gap:20px; text-align:center}
.slide.t-arriba .txt{flex:0 0 auto; max-width:940px}
.slide.t-arriba h2{font-size:33px; margin-bottom:4px}
.slide.t-arriba .frase{font-size:18px; margin-bottom:0}
.slide.t-oculto{justify-content:center}
.slide.t-arriba .media,.slide.t-oculto .media{max-width:96vw}
.slide.t-arriba .media img{max-height:64vh}
.slide.t-oculto .media img{max-height:78vh}
.slide.m-chico.t-arriba .media img{max-height:44vh}
.slide.m-chico.t-oculto .media img{max-height:52vh}
.slide.m-grande.t-arriba .media img{max-height:72vh}
.slide.m-grande.t-oculto .media img{max-height:88vh}
.slide.t-arriba .video{width:min(1100px,78vw)}
.slide.t-oculto .video{width:min(1180px,84vw)}
.slide.m-chico.t-arriba .video,.slide.m-chico.t-oculto .video{width:min(700px,56vw)}
.slide.m-grande.t-arriba .video{width:min(1260px,86vw)}
.slide.m-grande.t-oculto .video{width:min(1340px,90vw)}
.slide.m-lleno{padding:0}
.slide.m-lleno.t-oculto .media img{max-height:100vh; max-width:100vw; border:none; border-radius:0; box-shadow:none}
.slide.m-lleno.t-arriba .media img{max-height:78vh; max-width:96vw}
.slide.m-lleno .video{width:min(96vw,calc(86vh*16/9))}
.slide.m-lleno.t-oculto .video{width:min(100vw,calc(100vh*16/9)); border:none; border-radius:0; box-shadow:none}
.slide.solo{justify-content:center}
.slide.solo .txt{max-width:940px}
.slide.solo h2{font-size:52px}
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--acc); margin:0 0 10px}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight:400; font-size:64px; line-height:1.12; letter-spacing:-.015em; margin:0; text-wrap:balance}
h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight:400; font-size:40px; line-height:1.15; letter-spacing:-.01em; margin:0 0 12px; text-wrap:balance}
.frase{color:var(--acc2); font-size:21px; margin:0 0 18px; font-style:italic}
ul{margin:0; padding:0; list-style:none}
li{position:relative; padding-left:22px; margin-bottom:12px; color:var(--sub); font-size:19px}
li::before{content:''; position:absolute; left:0; top:12px; width:7px; height:7px; border-radius:999px; background:var(--acc)}
li b{color:var(--ink)}

/* Portada y láminas centradas (sin puntos ni imagen) */
.slide.centro{flex-direction:column; text-align:center; gap:0}
.marcas{display:flex; gap:30px; align-items:center; margin-bottom:36px}
.marcas img{height:44px}
.rule{width:74px; height:3px; background:var(--acc2); border-radius:999px; margin:26px 0}
.lede{color:var(--sub); font-size:22px; max-width:680px; margin:0; font-style:normal}
.ayuda{margin:38px 0 0; color:var(--faint); font-size:13.5px}
.ayuda b{color:var(--sub)}

/* Portón de clave (misma clave del constructor) */
.gate{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg); z-index:40; padding:20px;
}
.gate .caja{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:26px; box-shadow:var(--shadow); width:100%; max-width:400px;
}
.gate h1{font-size:27px; margin-bottom:4px}
.gate p{color:var(--sub); margin:0 0 16px; font-size:14.5px}
.gate label{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--faint); margin-bottom:7px}
.gate input{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:12px;
  background:var(--bg); color:var(--ink); font:inherit;
}
.gate input:focus{outline:2px solid var(--acc); outline-offset:1px; border-color:transparent}
.gate button{
  font:inherit; font-weight:600; cursor:pointer; border-radius:12px; border:1px solid transparent;
  padding:11px 18px; background:var(--acc); color:var(--accInk); margin-top:14px; width:100%;
}
.gate .err{color:var(--riesgo); font-size:13px; margin:10px 0 0; min-height:18px}

/* Vacío */
.vacio{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--sub)}
.vacio a{color:var(--acc)}

/* Notas del presentador (tecla N) */
.notas{
  position:fixed; left:22px; bottom:70px; max-width:440px; z-index:20; display:none;
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--acc2);
  border-radius:16px; padding:14px 18px; box-shadow:var(--shadow); font-size:14.5px;
}
.notas.ver{display:block}
.notas h3{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin:0 0 6px; font-weight:600}
.notas .cuerpoNota{margin:0; color:var(--ink); white-space:pre-wrap}
.notas .sigue{color:var(--sub); font-size:12.5px; border-top:1px solid var(--line); padding-top:8px; margin:10px 0 0}

/* Barra inferior */
.barra{position:fixed; left:0; right:0; bottom:0; height:52px; display:flex; align-items:center; gap:16px; padding:0 30px; border-top:1px solid var(--line); background:var(--bg); z-index:10}
.pista{flex:1; height:3px; background:var(--line); border-radius:999px; overflow:hidden}
.pista i{display:block; height:100%; background:var(--acc); border-radius:999px; transition:width .28s ease}
.cuenta{color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; min-width:56px; text-align:right}
.nav{display:flex; gap:8px}
.nav button,.nav a{
  font:inherit; font-size:14px; font-weight:600; cursor:pointer; border:1px solid var(--line);
  background:transparent; color:var(--acc); border-radius:999px; padding:6px 15px; text-decoration:none;
}
.pie{color:var(--faint); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw}
.pie b{color:var(--sub)}
@media (max-width:1100px){
  .slide{flex-direction:column; gap:26px; padding:30px 30px 70px; overflow-y:auto; align-items:flex-start}
  .slide.centro{align-items:center}
  .media{max-width:100%; align-self:center}
  .media img{max-height:44vh}
  .video,.slide.videoSolo .video{width:100%; align-self:center}
  h2{font-size:31px} h1{font-size:44px} .slide.solo h2{font-size:36px}
}

/* Pantalla en negro: tecla B del clicker, para cuando quieras que te miren a ti. */
body.negro .deck, body.negro .barra, body.negro .notas{visibility:hidden}
body.negro{background:#000}


/* ═══════════════ LÁMINAS DEL PORTAL DE CLIENTES ═══════════════
   Deck propio (revelado por pasos, contadores, barras, gráfica y demo
   interactiva) integrado al proyector del evento. Conserva SUS colores;
   el fondo es el de la plantilla del evento (marfil), así que las láminas
   que en el original eran verde oscuro usan aquí las variantes CLARAS del
   mismo sistema de color. Todo va prefijado con .pslide para no tocar las
   láminas que vienen del constructor. */
.slide.pslide{
  --p-pino:#1B5E20; --p-savia:#A6D96A; --p-savia-d:#7FB33F; --p-pinotea:#D9A441;
  --p-oro:#8D6E00; --p-papel2:#E4EDD6; --p-tinta:#132218; --p-tinta2:#4A6741;
  --p-tinta3:#7A9878; --p-rojo:#C62828; --p-ambar:#F9A825; --p-naranja:#E65100;
  --p-azul:#1565C0; --p-br:#C8E6C9;
  --p-mono:"IBM Plex Mono",ui-monospace,monospace;
  --p-sans:"IBM Plex Sans",system-ui,sans-serif;
  --p-disp:"Big Shoulders Display","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  flex-direction:column; justify-content:center; align-items:stretch; gap:0;
  padding:clamp(26px,4.4vh,58px) clamp(26px,4vw,74px) clamp(18px,3vh,38px);
  font-family:var(--p-sans); font-size:16px; color:var(--p-tinta); line-height:1.45;
}
.slide.pslide::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(27,94,32,.045) 0 1px,transparent 1px 52px)}
.pslide .inner{position:relative;z-index:2;width:100%;max-width:1580px;margin:0 auto}
.pslide h2,.pslide h3,.pslide h4{font-family:var(--p-disp);font-weight:800;line-height:.88;
  margin:0;text-transform:uppercase;letter-spacing:-.005em}
.pslide p{margin:0}
.pslide .eyebrow{font-family:var(--p-mono);font-size:clamp(10px,1.15vh,12.5px);letter-spacing:.22em;
  text-transform:uppercase;color:var(--p-pino);display:block;margin-bottom:14px}
.pslide .dsp{font-size:clamp(2.4rem,6vh,5.2rem);color:var(--p-pino)}
.pslide .dsp em{font-style:normal;color:var(--p-tinta)}

/* revelado por pasos */
.pslide [data-step]{opacity:0;transform:translateY(10px);
  transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.3,1)}
.pslide [data-step].show{opacity:1;transform:none}

/* portada */
.pslide .bub{display:inline-block;background:var(--p-papel2);border:1px solid var(--p-br);
  border-radius:15px 15px 15px 4px;padding:12px 18px;font-size:clamp(14px,1.9vh,19px);
  color:var(--p-tinta2);max-width:34ch}
.pslide .caret{display:inline-block;width:2px;height:1em;background:var(--p-savia-d);
  vertical-align:-2px;margin-left:2px;animation:pbk 1s steps(1) infinite}
@keyframes pbk{50%{opacity:0}}
.pslide .stamp{font-family:var(--p-mono);font-size:clamp(9px,1.1vh,11px);color:var(--p-tinta3);
  letter-spacing:.09em;margin-top:8px;display:block}
.pslide .costo{display:flex;gap:clamp(28px,4vw,64px);flex-wrap:wrap;margin-top:clamp(20px,3vh,38px);
  border-top:1px solid var(--p-br);padding-top:clamp(14px,2.2vh,26px)}
.pslide .costo div b{display:block;font-family:var(--p-disp);font-size:clamp(2rem,4.8vh,3.4rem);
  font-weight:900;color:var(--p-pino);line-height:.82}
.pslide .costo div span{font-family:var(--p-mono);font-size:clamp(9px,1.1vh,11px);letter-spacing:.13em;
  text-transform:uppercase;color:var(--p-tinta3);display:block;margin-top:8px;line-height:1.6}

/* paneles: mapa de áreas, candados de acceso, roadmap */
.pslide .map,.pslide .locks,.pslide .road{display:grid;gap:1px;background:var(--p-br);
  border:1px solid var(--p-br);border-radius:14px;overflow:hidden}
.pslide .map{grid-template-columns:repeat(3,1fr);margin-top:clamp(20px,3.2vh,42px)}
.pslide .locks{grid-template-columns:repeat(3,1fr);margin-top:clamp(20px,3vh,38px)}
.pslide .road{grid-template-columns:repeat(4,1fr);margin-top:clamp(18px,2.8vh,34px)}
.pslide .map article,.pslide .locks div,.pslide .road article{background:#FBFCF7}
.pslide .map article{padding:clamp(18px,2.8vh,32px) clamp(16px,1.7vw,28px)}
.pslide .locks div{padding:clamp(16px,2.4vh,28px) clamp(15px,1.5vw,25px)}
.pslide .road article{padding:clamp(14px,2.2vh,26px) clamp(13px,1.4vw,22px)}
.pslide .map .n,.pslide .locks .k{font-family:var(--p-mono);font-size:clamp(9px,1.1vh,11px);
  letter-spacing:.2em;color:var(--p-oro);display:block}
.pslide .locks .k{margin-bottom:11px}
.pslide .map h3{font-size:clamp(1.4rem,3.2vh,2.4rem);color:var(--p-pino);margin:8px 0 4px}
.pslide .locks h4,.pslide .road h4{font-size:clamp(1.15rem,2.6vh,1.9rem);color:var(--p-pino);
  margin:0 0 8px;line-height:.95}
.pslide .map .who{font-family:var(--p-mono);font-size:clamp(9.5px,1.15vh,11.5px);letter-spacing:.11em;
  color:var(--p-savia-d);text-transform:uppercase}
.pslide .map p,.pslide .locks p,.pslide .road p{font-size:clamp(12px,1.6vh,15.5px);
  color:var(--p-tinta2);line-height:1.55}
.pslide .map p{margin-top:12px}
.pslide .closing{margin-top:clamp(18px,2.8vh,34px);font-family:var(--p-disp);
  font-size:clamp(1.6rem,4vh,3rem);font-weight:900;text-transform:uppercase;color:var(--p-pino);
  line-height:.95;text-align:center}
.pslide .closing em{font-style:normal;color:var(--p-tinta)}

/* láminas de producto: dos columnas */
.pslide .two{display:grid;grid-template-columns:minmax(290px,.82fr) 1.25fr;
  gap:clamp(22px,2.6vw,54px);align-items:center}
.pslide .two .say h2{font-size:clamp(1.8rem,4.4vh,3.3rem)}
.pslide .pts{list-style:none;padding:0;margin:clamp(16px,2.4vh,28px) 0 0}
.pslide .pts li{padding:clamp(9px,1.4vh,14px) 0;border-top:1px solid var(--p-br);
  font-size:clamp(13px,1.75vh,17px);line-height:1.5;color:var(--p-tinta2);
  display:grid;grid-template-columns:auto 1fr;gap:12px;margin-bottom:0}
.pslide .pts li:last-child{border-bottom:1px solid var(--p-br)}
.pslide .pts li::before{content:none}
.pslide .pts li i{font-style:normal;font-family:var(--p-mono);font-size:clamp(9.5px,1.1vh,11.5px);
  color:var(--p-savia-d);padding-top:.42em}
.pslide .pts li b{color:var(--p-pino)}
.pslide .punch{margin-top:clamp(14px,2.2vh,26px);font-family:var(--p-disp);
  font-size:clamp(1.1rem,2.4vh,1.8rem);font-weight:800;text-transform:uppercase;
  color:var(--p-pino);line-height:1.02;border-left:4px solid var(--p-ambar);padding-left:14px}

/* maqueta del portal */
.pslide .mockwrap{display:flex;justify-content:center}
.pslide .mock{background:#fff;border:1px solid var(--p-br);border-radius:13px;overflow:hidden;
  box-shadow:0 18px 50px rgba(27,94,32,.17);width:100%;transform-origin:top center}
.pslide .mh{background:linear-gradient(135deg,#2E7D32,#1B5E20);color:#fff;padding:9px 15px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.pslide .mh .tt{font-weight:700;font-size:13px}
.pslide .mh .ts{font-size:10px;color:#A5D6A7}
.pslide .mh .pill{background:rgba(255,255,255,.17);border-radius:20px;padding:3px 11px;
  font-size:10px;font-family:var(--p-mono)}
.pslide .mtabs{display:flex;border-bottom:2px solid var(--p-br);padding:0 8px;background:#fff}
.pslide .mtabs span{padding:8px 13px;font-size:11.5px;font-weight:600;color:var(--p-tinta3);
  border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.pslide .mtabs span.on{color:var(--p-pino);border-bottom-color:#388E3C}
.pslide .mb{padding:13px}
.pslide .krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.pslide .kpi{background:#fff;border:1px solid var(--p-br);border-radius:8px;padding:10px 12px;
  position:relative;overflow:hidden}
.pslide .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#43A047}
.pslide .kpi.rd::before{background:var(--p-rojo)}
.pslide .kpi.or::before{background:var(--p-naranja)}
.pslide .kpi.am::before{background:var(--p-ambar)}
.pslide .kpi.bl::before{background:var(--p-azul)}
.pslide .kpi .l{font-size:9px;color:var(--p-tinta2);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.pslide .kpi .v{font-size:18px;font-weight:700;margin-top:4px;color:var(--p-tinta)}
.pslide .kpi.rd .v{color:var(--p-rojo)}.pslide .kpi.or .v{color:var(--p-naranja)}
.pslide .kpi.am .v{color:var(--p-ambar)}.pslide .kpi.bl .v{color:var(--p-azul)}
.pslide .kpi .s{font-size:9px;color:var(--p-tinta3);margin-top:2px}
.pslide .shead{background:linear-gradient(90deg,#2E7D32,#388E3C);color:#fff;padding:7px 12px;
  border-radius:6px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pslide .shead h4{margin:0;font-size:12px;font-family:var(--p-sans);font-weight:700;
  text-transform:none;letter-spacing:0;color:#fff}
.pslide .btnx{background:#1B5E20;color:#fff;border:0;border-radius:5px;padding:3px 9px;
  font-size:9.5px;font-weight:600;font-family:var(--p-sans)}
.pslide .btnx.pdf{background:var(--p-rojo)}
.pslide table.t{width:100%;border-collapse:collapse;font-size:11px}
.pslide table.t thead th{background:#2E7D32;color:#fff;padding:6px 8px;text-align:left;
  font-weight:600;font-size:10px;white-space:nowrap}
.pslide table.t td{padding:6px 8px;border-bottom:1px solid #E8F5E9;white-space:nowrap;color:var(--p-tinta)}
.pslide table.t tfoot td{background:#1B5E20;color:#fff;font-weight:700}
.pslide .num{text-align:right;font-family:var(--p-mono);font-size:10.5px}
.pslide .docn{color:var(--p-azul);font-weight:600;text-decoration:underline;
  text-underline-offset:2px;cursor:pointer}
.pslide .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:9px;
  font-weight:700;font-family:var(--p-mono)}
.pslide .tag.ok{background:#E8F5E9;color:#2E7D32}
.pslide .tag.a30{background:#FFF8E1;color:var(--p-oro)}
.pslide .tag.a60{background:#FFF3E0;color:var(--p-naranja)}
.pslide .tag.a90{background:#FFEBEE;color:var(--p-rojo)}
.pslide .tw{border:1px solid var(--p-br);border-radius:6px;overflow:hidden;margin-top:9px}
.pslide .hint{font-size:10px;color:var(--p-tinta3);font-family:var(--p-mono);margin-top:8px}

// YouTube / Vimeo / Drive van en iframe; cualquier otro enlace (o un archivo
// del bucket) va en <video>. El src se pone al LLEGAR a la lámina — con
// autoplay: el video ENTRA SOLO — y se quita al salir, así no suena un video
// detrás de otra lámina. V (o clic sobre el video) pausa y reanuda.
// Nota: Drive no permite autoplay en su visor; para que entre solo, mejor
// subir el archivo en el constructor o usar YouTube.
function embed(u) {
  const url = String(u || '').trim();
  let m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/)))
    return `<iframe data-src="https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1&autoplay=1&playsinline=1" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`;
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/)))
    return `<iframe data-src="https://player.vimeo.com/video/${m[1]}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  if ((m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/)))
    return `<iframe data-src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay" allowfullscreen></iframe>`;
  return `<video data-src="${esc(url)}" preload="none" playsinline></video>`;
}

async function pedir(clave) {
  const r = await fetch(FN, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'listar', clave }),
  });
  if (r.status === 401) throw new Error('clave');
  if (!r.ok) throw new Error('servidor');
  return r.json();
}

async function pedirSecciones(clave) {
  try {
    const r = await fetch(FN, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'secciones', clave }),
    });
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j.secciones) && j.secciones.length) SEC = j.secciones.map((x) => [x.clave, x.nombre]);

function teclear(s) {

function dibujarGrafica(s) {
  const svg = s.querySelector('#pChart');
  if (!svg) return;
  const py = [96, 108, 118, 127, 139, 121, 134, 139, 152, 148, 161, 157];
  const cy = [138, 152, 166, 181, 170, 188, 142, 68, null, null, null, null];
  const mes = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  const W = 980, H = 230, pad = { l: 12, r: 12, t: 10, b: 28 }, max = 200;
  const iw = (W - pad.l - pad.r) / 12, ih = H - pad.t - pad.b;
  let gh = '', bh = '', xh = '';
  for (let k = 0; k <= 4; k++) {
    const yy = pad.t + ih - (ih * k / 4);
    gh += '<line x1="' + pad.l + '" y1="' + yy + '" x2="' + (W - pad.r) + '" y2="' + yy + '"/>';
  }
  for (let n = 0; n < 12; n++) {
    const cx = pad.l + iw * n, bw = iw * 0.30;
    const h1 = ih * (py[n] / max), y1 = pad.t + ih - h1;
    bh += '<rect x="' + (cx + iw * 0.16) + '" y="' + y1 + '" width="' + bw + '" height="' + h1 + '" fill="none" stroke="#7A9878" stroke-width="1.4" rx="2"/>';
    if (cy[n] != null) {
      const h2 = ih * (cy[n] / max), y2 = pad.t + ih - h2, d = (n * 0.045);
      bh += '<rect x="' + (cx + iw * 0.52) + '" y="' + (pad.t + ih) + '" width="' + bw + '" height="0" fill="#2E7D32" rx="2">'
        + '<animate attributeName="height" to="' + h2 + '" dur="0.7s" begin="' + d + 's" fill="freeze"/>'
        + '<animate attributeName="y" to="' + y2 + '" dur="0.7s" begin="' + d + 's" fill="freeze"/></rect>';
    }
    xh += '<text x="' + (cx + iw / 2) + '" y="' + (H - 8) + '">' + mes[n] + '</text>';
  }
  s.querySelector('#pGrid').innerHTML = gh;
  s.querySelector('#pBars').innerHTML = bh;
  s.querySelector('#pXlab').innerHTML = xh;
}
// La maqueta se escala para que siempre quepa sobre la barra del proyector.
function ajustarMaqueta(s) {
  const m = s && s.querySelector('[data-fit]');

  m.style.marginBottom = (h * (k - 1)) + 'px';
}

        '</td><td class="num">' + x[5].toLocaleString('en-US', { minimumFractionDigits: 2 }) + '</td></tr>').join('');
      $('pmTot').textContent = d.tot;
      $('pModal').classList.add('on');
    });
  });
}
const cerrarFactura = () => $('pModal').classList.remove('on');
$('pmClose').addEventListener('click', cerrarFactura);
$('pModal').addEventListener('click', (e) => { if (e.target === $('pModal')) cerrarFactura(); });

// ── Construcción de las láminas (misma lógica visual que presentacion.html) ──
function construir() {
  const deck = $('deck');
  if (!laminas.length) {
    deck.innerHTML = `<div class="vacio">
      <p>El deck está vacío.</p>
      <p><a href="constructor.html">Agrega láminas en el constructor →</a></p>
    </div>`;
    $('cuenta').textContent = '0 / 0';
    return;
  }
  deck.innerHTML = laminas.map((l, n) => {
    if (l.estatica) return l.html;   // lámina propia del Portal
    const puntos = (l.cuerpo || '').split('\n').map((x) => x.trim()).filter(Boolean);
    const lista = puntos.length
      ? `<ul>${puntos.map((p) => `<li>${rico(p)}</li>`).join('')}</ul>` : '';

    // Portada / cierre: sin puntos y sin nada que proyectar → lámina centrada.
    if (!puntos.length && !l.imagen_url && !l.video_url) {
      return `<section class="slide centro">
        ${n === 0 ? '<div class="marcas"><img src="img/nt.png" alt="Natural Trade"><img src="img/gf.png" alt="Global Forest"></div>' : ''}
        <p class="eyebrow">${esc(secLabel(l.seccion))}</p>
        <h1>${esc(l.titulo)}</h1>
        <div class="rule"></div>
        ${l.frase ? `<p class="lede">${rico(l.frase)}</p>` : ''}
        ${n === 0 ? '<p class="ayuda">Avanza con el clicker, las flechas o clic en la lámina. <b>F</b> pantalla completa · <b>B</b> pantalla en negro · <b>N</b> notas · los videos entran solos, <b>V</b> los pausa.</p>' : ''}
      </section>`;
    }

    const media = l.video_url
      ? `<div class="video">${embed(l.video_url)}</div>`
      : l.imagen_url ? `<div class="media"><img src="${esc(l.imagen_url)}" alt=""></div>` : '';

    const txt = `<div class="txt">
      <p class="eyebrow">${esc(secLabel(l.seccion))}</p>
      <h2>${esc(l.titulo)}</h2>
      ${l.frase ? `<p class="frase">${rico(l.frase)}</p>` : ''}
      ${lista}
    </div>`;

    if (!media) return `<section class="slide solo">${txt}</section>`;

    // Diseño elegido en el constructor: dónde va el título y qué tan grande el media.
    const tam  = ['chico', 'normal', 'grande', 'lleno'].includes(l.media_tam) ? l.media_tam : 'normal';
    let modo = ['lado', 'arriba', 'oculto'].includes(l.titulo_modo) ? l.titulo_modo : 'lado';
    // Video sin puntos en modo clásico: el título solo estorbaría al lado → arriba.
    if (modo === 'lado' && l.video_url && !puntos.length) modo = 'arriba';

    if (modo === 'oculto')
      return `<section class="slide t-oculto m-${tam}">${media}</section>`;
    if (modo === 'arriba')
      return `<section class="slide t-arriba m-${tam}">
        <div class="txt"><p class="eyebrow">${esc(secLabel(l.seccion))}</p><h2>${esc(l.titulo)}</h2>
        ${l.frase ? `<p class="frase">${rico(l.frase)}</p>` : ''}</div>${media}</section>`;
    return `<section class="slide m-${tam}">${media}${txt}</section>`;
  }).join('');
  // Clic sobre un video: pausa/reanuda (no navega); sobre un iframe no hay control.
  cablearPortal();
  deck.querySelectorAll('.video').forEach((v) => v.addEventListener('click', (e) => {
    e.stopPropagation();
    const vd = v.querySelector('video');
    if (vd && vd.getAttribute('src')) vd.paused ? vd.play().catch(() => {}) : vd.pause();
  }));
  pintar();
}

// ── Navegación sin dependencias, pensada para CLICKER (igual que presentacion.html):
// los controles de presentación mandan Av Pág / Re Pág (algunos, flechas o espacio).
// La tecla B (o el botón de pantalla negra del clicker) apaga la proyección.
const pintar = () => {
  const slides = [...document.querySelectorAll('.slide')];
  slides.forEach((s, n) => {
    const on = n === i;
    s.classList.toggle('on', on);
    const f = s.querySelector('iframe[data-src]');
    if (f) {
      if (on && !f.getAttribute('src')) f.setAttribute('src', f.dataset.src);
      else if (!on && f.getAttribute('src')) f.removeAttribute('src');
    }
    // <video>: al llegar, ENTRA SOLO; al salir, se descarga (no suena de fondo).
    const v = s.querySelector('video[data-src]');
    if (v) {
      if (on && !v.getAttribute('src')) {
        v.src = v.dataset.src;
        v.play().catch(() => {});
      } else if (!on && v.getAttribute('src')) {
        v.pause();
        v.removeAttribute('src');
        v.load();
      }
    }
  });
  $('cuenta').textContent = (i + 1) + ' / ' + slides.length;
  $('pista').style.width = ((i + 1) / Math.max(1, slides.length) * 100) + '%';
  const l = laminas[i];
  $('pie').innerHTML = l
    ? (l.presentador ? `Presenta: <b>${esc(l.presentador)}</b> · ` : '') +
      esc(secLabel(l.seccion)) + ' · ' + Number(l.minutos || 0) + ' min' +
      (l.video_url ? ' · el video entra solo · <b>V</b> pausa' : '')
    : 'Evento 1-sep-2026 · Natural Trade / Global Forest';
  pintarPasos();
  animarPortal(slides[i]);
  pintarNotas();
};
const mover = (d) => {
  if (!laminas.length) return;
  const slides = document.querySelectorAll('.slide');
  // Las láminas del Portal se revelan por pasos con el MISMO clicker: primero
  // se agotan sus pasos y hasta entonces se pasa a la siguiente lámina.
  if (d > 0 && paso < maxPaso(slides[i])) { paso++; pintarPasos(); return; }
  if (d < 0 && paso > 0) { paso--; pintarPasos(); return; }
  const ni = Math.max(0, Math.min(laminas.length - 1, i + d));
  if (ni === i) return;
  i = ni;
  paso = d < 0 ? maxPaso(slides[i]) : 0;   // al regresar, la lámina llega completa
  pintar();
};

function pintarNotas() {
  const l = laminas[i];
  if (!l) return;
  $('notasTxt').textContent = l.notas || 'Sin notas para esta lámina.';
  const sig = laminas[i + 1];
  $('notasSigue').textContent = sig
    ? 'Sigue: ' + sig.titulo + (sig.presentador ? ' — presenta ' + sig.presentador : '')
    : 'Es la última lámina.';
}

const enGate = () => !$('gate').classList.contains('fuera');

document.addEventListener('keydown', (e) => {
  if (enGate()) return;
  // Si el foco está en un campo de la demo del Portal, el teclado es suyo.
  if (document.activeElement && document.activeElement.tagName === 'INPUT' && e.key !== 'Escape') return;
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); mover(1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); mover(-1); }
  else if (k === 'Home') { i = 0; paso = 0; pintar(); }
  else if (k === 'End') { i = laminas.length - 1; paso = 0; pintar(); }
  else if (k === 'Escape') { cerrarFactura(); }
  else if (k === 'b' || k === 'B' || k === '.') { document.body.classList.toggle('negro'); }
  else if (k === 'f' || k === 'F') { pantallaCompleta(); }
  else if (k === 'n' || k === 'N') { $('notas').classList.toggle('ver'); }
  else if (k === 'v' || k === 'V') {
    const v = document.querySelector('.slide.on video');
    if (v) {
      e.preventDefault();
      if (!v.getAttribute('src')) { v.src = v.dataset.src; v.play().catch(() => {}); }
      else v.paused ? v.play().catch(() => {}) : v.pause();
    }
  }
});

// Clic en la lámina: mitad derecha avanza, mitad izquierda retrocede.
$('deck').addEventListener('click', (e) => {
  if (e.target.closest('input,button,a,.docn')) return;   // demo del Portal
  if (document.body.classList.contains('negro')) { document.body.classList.remove('negro'); return; }
  mover(e.clientX > window.innerWidth / 2 ? 1 : -1);
});

// Deslizar con el dedo, por si se proyecta desde una tableta.
let x0 = null;
document.addEventListener('touchstart', (e) => { x0 = e.changedTouches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (x0 === null || enGate()) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 45) mover(dx < 0 ? 1 : -1);
  x0 = null;
}, { passive: true });

const pantallaCompleta = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};

$('sig').addEventListener('click', (e) => { e.stopPropagation(); mover(1); });
$('ant').addEventListener('click', (e) => { e.stopPropagation(); mover(-1); });
$('pantalla').addEventListener('click', (e) => { e.stopPropagation(); pantallaCompleta(); });
$('notasBtn').addEventListener('click', (e) => { e.stopPropagation(); $('notas').classList.toggle('ver'); });

// ── Portón ──
async function entrar(cl) {
  $('gateErr').textContent = '';
  $('entrar').disabled = true;
  try {
    const j = await pedir(cl);
    await pedirSecciones(cl);
    localStorage.setItem(LS, cl);
    // Las 8 del Portal se mezclan con las del constructor por seccion+orden.
    laminas = [...(j.laminas || []), ...laminasPortal()].sort((a, b) =>
      secIdx(a.seccion) - secIdx(b.seccion) || a.orden - b.orden ||
      String(a.creado_en).localeCompare(String(b.creado_en)));
    $('gate').classList.add('fuera');
    $('gate').style.display = 'none';
    construir();
    window.focus();
  } catch (e) {
    $('gateErr').textContent = e.message === 'clave' ? 'Clave incorrecta.' : 'No se pudo conectar. Reintenta.';
  } finally {
    $('entrar').disabled = false;
  }
}

$('entrar').addEventListener('click', () => entrar($('clave').value.trim()));
$('clave').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar($('clave').value.trim()); });

// Sesión recordada: sirve la clave del constructor o la del tablero del padrón.
const guardada = localStorage.getItem(LS) || localStorage.getItem('nt_evento_clave');
if (guardada) entrar(guardada); else $('clave').focus();
</script>
