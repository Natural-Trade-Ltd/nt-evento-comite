<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cartel de mesa · Encuesta 1-sep</title>
<style>
/* Dueto Tierra — siempre en modo día: esto se imprime en papel */
:root{
  --bg:#F2EDE3; --card:#FBF8F1; --line:#E0D8C8;
  --ink:#3A3129; --sub:#71655A; --faint:#9C8F80;
  --acc:#587F6B; --acc2:#8A6F5B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0; background:#E7E0D2; color:var(--ink); font-family:var(--sans)}
.barra{
  position:sticky; top:0; z-index:9; display:flex; gap:10px; align-items:center;
  padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--line);
}
.barra b{font-weight:600; font-size:14px}
.barra .mut{color:var(--sub); font-size:13px}
.btn{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  font:inherit; font-size:14px; font-weight:600; border-radius:12px;
  padding:10px 15px; cursor:pointer; text-decoration:none;
}
.btn.p{background:var(--acc); border-color:var(--acc); color:#F6FBF7}
.grow{flex:1}

.hoja{width:8.5in; margin:18px auto; display:flex; flex-direction:column}
.tarjeta{
  width:8.5in; height:5.5in; background:var(--card); color:var(--ink);
  padding:0.42in 0.5in; display:flex; align-items:center; gap:0.42in;
  border:1px solid var(--line);
}
.tarjeta + .tarjeta{border-top:1px dashed var(--acc2)}
.qr{flex:none; width:2.9in; height:2.9in; display:block}
.txt{flex:1; min-width:0}
.eyebrow{
  font-size:10.5pt; letter-spacing:.16em; text-transform:uppercase;
  font-weight:600; color:var(--faint); margin:0 0 10px;
}
h1{
  font-family:var(--serif); font-weight:400; font-size:30pt; line-height:1.08;
  letter-spacing:-.01em; margin:0; text-wrap:balance;
}
.regla{width:60px; height:3px; background:var(--acc2); border-radius:99px; margin:14px 0 13px}
.lede{font-size:12.5pt; line-height:1.5; color:var(--sub); margin:0 0 14px; max-width:34ch}
.lede b{color:var(--ink); font-weight:600}
.pasos{font-size:10.5pt; color:var(--sub); line-height:1.6; margin:0}
.pasos b{color:var(--acc); font-weight:600}
.pie{
  margin-top:16px; padding-top:11px; border-top:1px solid var(--line);
  display:flex; align-items:center; gap:14px;
}
.pie img{height:0.26in; width:auto; display:block}
.pie span{margin-left:auto; font-size:8.5pt; color:var(--faint); letter-spacing:.06em}

@media print{
  @page{size:letter portrait; margin:0}
  body{background:#fff}
  .barra{display:none}
  .hoja{margin:0; width:8.5in}
  .tarjeta{border:0; break-inside:avoid; height:5.5in}
  .tarjeta + .tarjeta{border-top:1px dashed #CBBFA9}
}
@media (max-width:900px){
  .hoja{width:100%; padding:0 10px}
  .tarjeta{width:100%; height:auto; flex-direction:column; text-align:center; padding:26px 22px}
  .qr{width:2.4in; height:2.4in}
  .lede{margin-left:auto; margin-right:auto}
  .pie{justify-content:center}
}
</style>
</head>
<body>

<div class="barra">
  <b>Cartel de mesa</b>
  <span class="mut">Media carta · dos por hoja. Imprime, corta por la línea punteada y ponlos en los holders.</span>
  <span class="grow"></span>
  <a class="btn" href="index.html">← Portal</a>
  <button class="btn p" onclick="print()">🖨 Imprimir</button>
</div>

<div class="hoja" id="hoja"></div>

<script>
const TARJETA = `
  <div class="tarjeta">
    <img class="qr" src="img/qr-encuesta.png" alt="Código QR de la encuesta">
    <div class="txt">
      <p class="eyebrow">Natural Trade · Global Forest</p>
      <h1>¿Nos cuentas cómo compras?</h1>
      <div class="regla"></div>
      <p class="lede">Ocho preguntas, <b>menos de tres minutos</b>. Con tus respuestas
        te armamos ofertas a tu medida en vez de listas genéricas.</p>
      <p class="pasos"><b>1.</b> Abre la cámara de tu teléfono &nbsp;·&nbsp;
        <b>2.</b> Apúntala al código &nbsp;·&nbsp; <b>3.</b> Toca la liga que aparece</p>
      <div class="pie">
        <img src="img/nt.png" alt="Natural Trade">
        <img src="img/gf.png" alt="Global Forest">
        <span>1 DE SEPTIEMBRE DE 2026</span>
      </div>
    </div>
  </div>`;
document.getElementById('hoja').innerHTML = TARJETA + TARJETA;
</script>
</body>
</html>
