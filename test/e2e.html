<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRUEBA LOCAL · Comité · Evento 1-sep</title>
<!-- ==================================================================
     ARNÉS DE PRUEBA E2E — no es el portal real.
     Carga el MISMO js/app.js y css/app.css de producción, pero el import
     map de abajo sustituye supabase-js por test/mock-supabase.js: datos
     en memoria (los 15 bloques reales) y sesión ya iniciada, sin tocar
     el proyecto cytopyytymxjwvfhosvg.
     Usa ?premig=1 para simular la base SIN la migración 02.
     ================================================================== -->
<base href="../">
<script type="importmap">
{ "imports": { "https://esm.sh/@supabase/supabase-js@2.45.4": "./test/mock-supabase.js" } }
</script>
<meta name="theme-color" content="#0b1310">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>

<!-- ================= GATE ================= -->
<div id="gate">
  <div class="gatebox">
    <div class="brandmark">🌲</div>
    <h1>Comité organizador</h1>
    <p>Cóctel para clientes clave · 1 de septiembre de 2026<br>Presidente Polanco, CDMX · Salón «Feria»</p>
    <button class="gbtn" id="gGoogle">Continuar con Google</button>
    <div class="sep">o con tu correo</div>
    <div class="row">
      <input type="email" id="gMail" placeholder="tu@naturaltrade.ca" autocomplete="email">
      <button class="btn" id="gLink">Enviar enlace</button>
    </div>
    <div id="gErr" class="gerr hide"></div>
    <details style="margin-top:14px;text-align:left">
      <summary class="mut2" style="cursor:pointer">¿El enlace del correo no te regresó aquí?</summary>
      <div class="row" style="margin-top:8px">
        <input type="text" id="gPaste" placeholder="Pega aquí el enlace completo del correo">
        <button class="btn sm" id="gPasteBtn">Entrar</button>
      </div>
    </details>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hide">
<header>
  <div class="hbar">
    <div class="logo">🌲</div>
    <div class="grow">
      <div class="htitle">Comité · Evento 1-sep</div>
      <div class="hsub">Natural Trade · Global Forest</div>
    </div>
    <div class="cd" id="cdEvento" title="Días para el evento"><b>—</b><span>días al evento</span></div>
    <button class="ibtn" id="btnInvitar" title="Invitar a alguien al portal">✉</button>
    <button class="ibtn" id="btnTheme" title="Claro / oscuro">◐</button>
    <button class="ibtn" id="btnAyuda" title="Cómo se usa este portal">?</button>
    <div class="me" id="meChip"><div class="av" id="meAv">·</div><span class="nm" id="meNm">—</span></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <section class="sec" data-sec="inicio"></section>
  <section class="sec" data-sec="mensajes"></section>
  <section class="sec" data-sec="programa"></section>
  <section class="sec" data-sec="videos"></section>
  <section class="sec" data-sec="audiovisuales"></section>
  <section class="sec" data-sec="interaccion"></section>
  <section class="sec" data-sec="reparto"></section>
  <section class="sec" data-sec="repositorio"></section>
  <section class="sec" data-sec="ideas"></section>
  <section class="sec" data-sec="tareas"></section>
</main>
</div>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal">
  <div class="mbox" id="mbox">
    <div class="mhead"><h3 id="mTitle">—</h3><button class="ibtn" id="mX">✕</button></div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>

<!-- ============ PROGRAMA FINAL (imprimir / compartir) ============ -->
<div id="progFinal" class="hide"></div>

<div id="toast"></div>
<div style="position:fixed;bottom:8px;left:8px;z-index:999;background:#9A6A12;color:#fff;
  padding:3px 10px;border-radius:8px;font:600 11px system-ui;pointer-events:none">
  PRUEBA LOCAL · datos simulados</div>
<script type="module" src="js/app.js?v=7"></script>
</body>
</html>
